<style>
  :root { --bg:#111418; --panel:#1b1f26; --line:#2a3038; --text:#e8eaed; --muted:#9aa3ad; --accent:#5b9dff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(17,20,24,.92);
    backdrop-filter:blur(10px); padding:env(safe-area-inset-top) 16px 12px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:14px 0 10px; font-weight:600; }
  .search { width:100%; padding:11px 14px; font-size:16px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel); color:var(--text); outline:none; }
  .search:focus { border-color:var(--accent); }
  .count { color:var(--muted); font-size:12px; margin-top:8px; }
  main { padding:8px 12px 40px; max-width:1100px; margin:0 auto; }
  .cat h2 { font-size:14px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); margin:22px 4px 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:560px){ .grid{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .grid{ grid-template-columns:repeat(4,1fr);} }
  .card { margin:0; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .12s; }
  .card:active { transform:scale(.97); }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#000; }
  .card figcaption { padding:8px 10px; font-size:12.5px; color:var(--text); }
  .empty { color:var(--muted); text-align:center; padding:40px 0; display:none; }
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:100;
    display:none; align-items:center; justify-content:center; touch-action:pan-y; }
  .lb.open { display:flex; }
  .lb img { max-width:100%; max-height:88vh; object-fit:contain; }
  .lb .cap { position:absolute; bottom:env(safe-area-inset-bottom); left:0; right:0;
    text-align:center; padding:14px; font-size:15px; background:linear-gradient(transparent,rgba(0,0,0,.7)); }
  .lb .x { position:absolute; top:calc(env(safe-area-inset-top) + 10px); right:14px;
    font-size:30px; color:#fff; background:none; border:none; cursor:pointer; line-height:1; }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:40px;
    color:#fff; background:none; border:none; cursor:pointer; padding:10px 16px; opacity:.7; }
  .lb .prev { left:0; } .lb .next { right:0; }
  @media(hover:none){ .lb .nav{ display:none; } }
  .topbar { display:flex; align-items:center; padding:0 16px; height:48px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  .topbar a { display:flex; align-items:center; gap:6px; color:var(--text);
    text-decoration:none; font-size:14px; padding:8px 10px; border-radius:8px; }
  .topbar a:hover { background:var(--line); }
  .topbar .title { flex:1; text-align:center; font-weight:600; font-size:14px; }
  .topbar svg { width:16px; height:16px; }
</style>
</head>

<script>
const CARDS = [{"title": "Aperture and DOF", "src": "images/aperture_and_dof.jpg"}, {"title": "F-stop Table", "src": "images/f-stop_table.jpg"}, {"title": "ISO sensitivity Guide", "src": "images/iso_sensitivity_guide.jpg"}, {"title": "Sunny 16 Rule", "src": "images/sunny_16_rule.jpg"}, {"title": "The Exposure Triangle", "src": "images/the_exposure_triangle.jpg"}, {"title": "Which Shutter Speed", "src": "images/which_shutter_speed.jpg"}, {"title": "APS C vs Full Frame", "src": "images/aps_c_vs_full_frame.jpg"}, {"title": "Camera Handling Guide", "src": "images/camera_handling_guide.jpg"}, {"title": "Color Wheel", "src": "images/color_wheel.jpg"}, {"title": "Continuous Lightings", "src": "images/continuous_lightings.jpg"}, {"title": "Flash Front or Rear", "src": "images/flash_front_or_rear.jpg"}, {"title": "How TTL Flash Works", "src": "images/how_ttl_flash_works.jpg"}, {"title": "How a Lens Works", "src": "images/how_a_lens_works.jpg"}, {"title": "Image Stabilization", "src": "images/image_stabilization.jpg"}, {"title": "Macro Lens", "src": "images/macro_lens.jpg"}, {"title": "Backlit Portraits", "src": "images/backlit_portraits.jpg"}, {"title": "Creative Newborns", "src": "images/creative_newborns.jpg"}, {"title": "Cute Pet Portraits", "src": "images/cute_pet_portraits.jpg"}, {"title": "Garden Backlit Portrait", "src": "images/garden_backlit_portrait.jpg"}, {"title": "Low Key Portraits", "src": "images/low_key_portraits.jpg"}, {"title": "Pet Caricatures", "src": "images/pet_caricatures.jpg"}, {"title": "Portrait With A Twist", "src": "images/portrait_with_a_twist.jpg"}, {"title": "Powder Paint Portrait", "src": "images/powder_paint_portrait.jpg"}, {"title": "Twilight Flash Portrait", "src": "images/twilight_flash_portrait.jpg"}, {"title": "Bugs Eye View", "src": "images/bugs_eye_view.jpg"}, {"title": "Butterflies", "src": "images/butterflies.jpg"}, {"title": "Butterfly Wings", "src": "images/butterfly_wings.jpg"}, {"title": "Flower Abstracts", "src": "images/flower_abstracts.jpg"}, {"title": "Garden Bird Portraits", "src": "images/garden_bird_portraits.jpg"}, {"title": "Its A Small World", "src": "images/its_a_small_world.jpg"}, {"title": "Leaves In Ice", "src": "images/leaves_in_ice.jpg"}, {"title": "Morning Dew", "src": "images/morning_dew.jpg"}, {"title": "Play With Perspective", "src": "images/play_with_perspective.jpg"}, {"title": "Shift Flower Focus", "src": "images/shift_flower_focus.jpg"}, {"title": "Abstract Bubbles", "src": "images/abstract_bubbles.jpg"}, {"title": "Classic Still Life", "src": "images/classic_still_life.jpg"}, {"title": "Fine Art Vegatables", "src": "images/fine_art_vegatables.jpg"}, {"title": "Interiors", "src": "images/interiors.jpg"}, {"title": "Refraction Still Life", "src": "images/refraction_still_life.jpg"}, {"title": "Cross Processed Look", "src": "images/cross_processed_look.jpg"}, {"title": "Double Exposures", "src": "images/double_exposures.jpg"}, {"title": "Smoke Trail Art", "src": "images/smoke_trail_art.jpg"}, {"title": "Spirograms", "src": "images/spirograms.jpg"}, {"title": "Wire Wool Trails", "src": "images/wire_wool_trails.jpg"}];
const cardEls = [...document.querySelectorAll('.card')];
const q = document.getElementById('q');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const total = CARDS.length;

function updateCount(n){ countEl.textContent = n + " of " + total + " cards"; }
updateCount(total);

q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  const catVisible = {};
  cardEls.forEach(el => {
    const match = !term || el.dataset.title.includes(term);
    el.style.display = match ? '' : 'none';
    if (match){ shown++; const c = el.closest('.cat'); catVisible[c.querySelector('h2').textContent]=true; }
  });
  document.querySelectorAll('.cat').forEach(c => {
    const h = c.querySelector('h2').textContent;
    c.style.display = (!term || catVisible[h]) ? '' : 'none';
  });
  emptyEl.style.display = shown ? 'none' : 'block';
  updateCount(shown);
});

const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
const cap = document.getElementById('cap');
let cur = 0;
function open(i){ cur=i; lbimg.src=CARDS[i].src; cap.textContent=CARDS[i].title; lb.classList.add('open'); }
function close(){ lb.classList.remove('open'); lbimg.src=''; }
function step(d){ cur=(cur+d+total)%total; lbimg.src=CARDS[cur].src; cap.textContent=CARDS[cur].title; }
cardEls.forEach(el => el.addEventListener('click', () => open(+el.dataset.idx)));
document.getElementById('close').addEventListener('click', close);
document.getElementById('prev').addEventListener('click', e=>{e.stopPropagation();step(-1);});
document.getElementById('next').addEventListener('click', e=>{e.stopPropagation();step(1);});
lb.addEventListener('click', e=>{ if(e.target===lb) close(); });
document.addEventListener('keydown', e=>{ if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close(); if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1); });
let sx=0;
lb.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e=>{ const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50) step(dx<0?1:-1); }, {passive:true});
</script>
